[package]
name = "lunchbox"
version = "0.1.0"
edition = "2024"
description = "Run-scoped skill runtime: mount a sealed per-run Skill set, hand it to a worker, always unmount."

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
fs4 = "0.13"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
time = { version = "0.3", features = ["formatting", "macros"] }
toml = "0.9"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
parking_lot = "0.12"
